<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background: dark navy blue rounded square -->
  <rect width="100" height="100" rx="18" fill="#1a3464"/>

  <!-- Upward-trending chart line with arrow -->
  <!-- Axes (subtle) -->
  <line x1="18" y1="75" x2="82" y2="75" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18" y1="75" x2="18" y2="22" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Trend line: bottom-left to top-right -->
  <polyline
    points="22,65  38,52  54,56  70,36  82,24"
    fill="none"
    stroke="white"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Arrow head at the end -->
  <polyline
    points="74,20  82,24  78,32"
    fill="none"
    stroke="white"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
