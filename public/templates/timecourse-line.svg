<svg viewBox="0 0 280 210" xmlns="http://www.w3.org/2000/svg">
  <rect width="280" height="210" fill="white"/>

  <!-- Legend (top, inside margins) -->
  <!-- Series A: blue circle -->
  <circle cx="58" cy="12" r="3.5" fill="#1F4FA8"/>
  <line x1="49" y1="12" x2="67" y2="12" stroke="#1F4FA8" stroke-width="2"/>
  <text x="71" y="16" font-size="10" fill="#333" font-family="Arial, Helvetica, sans-serif">Series A</text>
  <!-- Series B: red square -->
  <rect x="119" y="8.5" width="7" height="7" fill="#E2211C"/>
  <line x1="110" y1="12" x2="129" y2="12" stroke="#E2211C" stroke-width="2"/>
  <text x="132" y="16" font-size="10" fill="#333" font-family="Arial, Helvetica, sans-serif">Series B</text>
  <!-- Series C: green triangle -->
  <polygon points="183,8.5 186.5,15 179.5,15" fill="#1B9E4B"/>
  <line x1="172" y1="12" x2="191" y2="12" stroke="#1B9E4B" stroke-width="2"/>
  <text x="194" y="16" font-size="10" fill="#333" font-family="Arial, Helvetica, sans-serif">Series C</text>

  <!-- Y-axis label -->
  <text x="10" y="108" text-anchor="middle" font-size="12" fill="#000" font-family="Arial, Helvetica, sans-serif" transform="rotate(-90,10,108)">Signal (a.u.)</text>

  <!-- X-axis label -->
  <text x="152" y="207" text-anchor="middle" font-size="12" fill="#000" font-family="Arial, Helvetica, sans-serif">Time (s)</text>

  <!-- Frame -->
  <rect x="42" y="25" width="222" height="155" fill="none" stroke="#000" stroke-width="1.5"/>

  <!-- Horizontal grid lines (light gray, dashed) -->
  <!-- y_px(val) = 180 - val*155, val=0..1 in steps of 0.2 -->
  <!-- y=180(0), y=149(0.2), y=118(0.4), y=87(0.6), y=56(0.8), y=25(1.0) -->
  <line x1="42" y1="149" x2="264" y2="149" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="42" y1="118" x2="264" y2="118" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="42" y1="87"  x2="264" y2="87"  stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="42" y1="56"  x2="264" y2="56"  stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- X tick marks (inward) -->
  <!-- x_px(t) = 42 + t*(222/8), t=0..8 → step=27.75 -->
  <line x1="42"  y1="180" x2="42"  y2="175" stroke="#000" stroke-width="1"/>
  <line x1="70"  y1="180" x2="70"  y2="175" stroke="#000" stroke-width="1"/>
  <line x1="97"  y1="180" x2="97"  y2="175" stroke="#000" stroke-width="1"/>
  <line x1="125" y1="180" x2="125" y2="175" stroke="#000" stroke-width="1"/>
  <line x1="153" y1="180" x2="153" y2="175" stroke="#000" stroke-width="1"/>
  <line x1="181" y1="180" x2="181" y2="175" stroke="#000" stroke-width="1"/>
  <line x1="208" y1="180" x2="208" y2="175" stroke="#000" stroke-width="1"/>
  <line x1="236" y1="180" x2="236" y2="175" stroke="#000" stroke-width="1"/>
  <line x1="264" y1="180" x2="264" y2="175" stroke="#000" stroke-width="1"/>

  <!-- X tick labels -->
  <text x="42"  y="192" text-anchor="middle" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">0</text>
  <text x="70"  y="192" text-anchor="middle" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">1</text>
  <text x="97"  y="192" text-anchor="middle" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">2</text>
  <text x="125" y="192" text-anchor="middle" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">3</text>
  <text x="153" y="192" text-anchor="middle" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">4</text>
  <text x="181" y="192" text-anchor="middle" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">5</text>
  <text x="208" y="192" text-anchor="middle" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">6</text>
  <text x="236" y="192" text-anchor="middle" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">7</text>
  <text x="264" y="192" text-anchor="middle" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">8</text>

  <!-- Y tick marks (inward) -->
  <line x1="42" y1="180" x2="47" y2="180" stroke="#000" stroke-width="1"/>
  <line x1="42" y1="149" x2="47" y2="149" stroke="#000" stroke-width="1"/>
  <line x1="42" y1="118" x2="47" y2="118" stroke="#000" stroke-width="1"/>
  <line x1="42" y1="87"  x2="47" y2="87"  stroke="#000" stroke-width="1"/>
  <line x1="42" y1="56"  x2="47" y2="56"  stroke="#000" stroke-width="1"/>
  <line x1="42" y1="25"  x2="47" y2="25"  stroke="#000" stroke-width="1"/>

  <!-- Y tick labels -->
  <text x="38" y="183" text-anchor="end" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">0</text>
  <text x="38" y="152" text-anchor="end" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">0.2</text>
  <text x="38" y="121" text-anchor="end" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">0.4</text>
  <text x="38" y="90"  text-anchor="end" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">0.6</text>
  <text x="38" y="59"  text-anchor="end" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">0.8</text>
  <text x="38" y="28"  text-anchor="end" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">1.0</text>

  <!-- Series A (blue) — sigmoidal rise then plateau -->
  <!-- data: 0.04, 0.18, 0.40, 0.65, 0.82, 0.90, 0.87, 0.83, 0.80 -->
  <!-- y_px = 180 - val*155 -->
  <!-- points: (42,174)(70,152)(97,118)(125,79)(153,53)(181,40)(208,45)(236,51)(264,56) -->
  <polyline points="42,174 70,152 97,118 125,79 153,53 181,40 208,45 236,51 264,56"
    fill="none" stroke="#1F4FA8" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="42"  cy="174" r="3.5" fill="#1F4FA8"/>
  <circle cx="70"  cy="152" r="3.5" fill="#1F4FA8"/>
  <circle cx="97"  cy="118" r="3.5" fill="#1F4FA8"/>
  <circle cx="125" cy="79"  r="3.5" fill="#1F4FA8"/>
  <circle cx="153" cy="53"  r="3.5" fill="#1F4FA8"/>
  <circle cx="181" cy="40"  r="3.5" fill="#1F4FA8"/>
  <circle cx="208" cy="45"  r="3.5" fill="#1F4FA8"/>
  <circle cx="236" cy="51"  r="3.5" fill="#1F4FA8"/>
  <circle cx="264" cy="56"  r="3.5" fill="#1F4FA8"/>

  <!-- Series B (red) — slower rise, lower plateau -->
  <!-- data: 0.02, 0.08, 0.22, 0.40, 0.55, 0.63, 0.66, 0.67, 0.68 -->
  <!-- y_px: (42,177)(70,168)(97,146)(125,118)(153,95)(181,82)(208,78)(236,76)(264,75) -->
  <polyline points="42,177 70,168 97,146 125,118 153,95 181,82 208,78 236,76 264,75"
    fill="none" stroke="#E2211C" stroke-width="2" stroke-linejoin="round"/>
  <rect x="38.5" y="173.5" width="7" height="7" fill="#E2211C"/>
  <rect x="66.5" y="164.5" width="7" height="7" fill="#E2211C"/>
  <rect x="93.5" y="142.5" width="7" height="7" fill="#E2211C"/>
  <rect x="121.5" y="114.5" width="7" height="7" fill="#E2211C"/>
  <rect x="149.5" y="91.5" width="7" height="7" fill="#E2211C"/>
  <rect x="177.5" y="78.5" width="7" height="7" fill="#E2211C"/>
  <rect x="204.5" y="74.5" width="7" height="7" fill="#E2211C"/>
  <rect x="232.5" y="72.5" width="7" height="7" fill="#E2211C"/>
  <rect x="260.5" y="71.5" width="7" height="7" fill="#E2211C"/>

  <!-- Series C (green) — fast rise, then decay -->
  <!-- data: 0.10, 0.48, 0.72, 0.65, 0.50, 0.40, 0.32, 0.26, 0.23 -->
  <!-- y_px: (42,165)(70,106)(97,68)(125,79)(153,103)(181,118)(208,131)(236,140)(264,144) -->
  <polyline points="42,165 70,106 97,68 125,79 153,103 181,118 208,131 236,140 264,144"
    fill="none" stroke="#1B9E4B" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="42,161 45.5,168 38.5,168" fill="#1B9E4B"/>
  <polygon points="70,102 73.5,109 66.5,109" fill="#1B9E4B"/>
  <polygon points="97,64  100.5,71 93.5,71"  fill="#1B9E4B"/>
  <polygon points="125,75 128.5,82 121.5,82" fill="#1B9E4B"/>
  <polygon points="153,99 156.5,106 149.5,106" fill="#1B9E4B"/>
  <polygon points="181,114 184.5,121 177.5,121" fill="#1B9E4B"/>
  <polygon points="208,127 211.5,134 204.5,134" fill="#1B9E4B"/>
  <polygon points="236,136 239.5,143 232.5,143" fill="#1B9E4B"/>
  <polygon points="264,140 267.5,147 260.5,147" fill="#1B9E4B"/>
</svg>
