<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200">
  <rect width="280" height="200" fill="white"/>

  <!-- Chart frame -->
  <rect x="52" y="15" width="213" height="145" fill="none" stroke="#111827" stroke-width="1"/>

  <!-- Bars (gray #9CA3AF), bottom of frame at y=160 -->
  <!-- Control: center=78.6, val=1.0, py_top=141.9, height=18.1 -->
  <rect x="61.1" y="141.9" width="35" height="18.1" fill="#9CA3AF"/>
  <!-- TNF-alpha: center=131.9, val=4.2, py_top=83.9, height=76.1 -->
  <rect x="114.4" y="83.9" width="35" height="76.1" fill="#9CA3AF"/>
  <!-- IL-1beta: center=185.1, val=6.8, py_top=36.8, height=123.2 -->
  <rect x="167.6" y="36.8" width="35" height="123.2" fill="#9CA3AF"/>
  <!-- LPS: center=238.4, val=3.1, py_top=103.8, height=56.2 -->
  <rect x="220.9" y="103.8" width="35" height="56.2" fill="#9CA3AF"/>

  <!-- Error bars (T-shaped, centered on bar top) -->
  <g stroke="#374151" stroke-width="1">
    <!-- Control: center=78.6, bar_top=141.9, sem_px=2.7 -->
    <line x1="78.6" y1="139.2" x2="78.6" y2="144.6"/>
    <line x1="74.6" y1="139.2" x2="82.6" y2="139.2"/>
    <line x1="74.6" y1="144.6" x2="82.6" y2="144.6"/>
    <!-- TNF-alpha: center=131.9, bar_top=83.9, sem_px=6.9 -->
    <line x1="131.9" y1="77.0" x2="131.9" y2="90.8"/>
    <line x1="127.9" y1="77.0" x2="135.9" y2="77.0"/>
    <line x1="127.9" y1="90.8" x2="135.9" y2="90.8"/>
    <!-- IL-1beta: center=185.1, bar_top=36.8, sem_px=10.0 -->
    <line x1="185.1" y1="26.8" x2="185.1" y2="46.8"/>
    <line x1="181.1" y1="26.8" x2="189.1" y2="26.8"/>
    <line x1="181.1" y1="46.8" x2="189.1" y2="46.8"/>
    <!-- LPS: center=238.4, bar_top=103.8, sem_px=5.1 -->
    <line x1="238.4" y1="98.7" x2="238.4" y2="108.9"/>
    <line x1="234.4" y1="98.7" x2="242.4" y2="98.7"/>
    <line x1="234.4" y1="108.9" x2="242.4" y2="108.9"/>
  </g>

  <!-- Y ticks (inward, both sides) -->
  <g stroke="#374151" stroke-width="0.75">
    <line x1="52" y1="160" x2="56" y2="160"/><line x1="261" y1="160" x2="265" y2="160"/>
    <line x1="52" y1="123.8" x2="56" y2="123.8"/><line x1="261" y1="123.8" x2="265" y2="123.8"/>
    <line x1="52" y1="87.5" x2="56" y2="87.5"/><line x1="261" y1="87.5" x2="265" y2="87.5"/>
    <line x1="52" y1="51.3" x2="56" y2="51.3"/><line x1="261" y1="51.3" x2="265" y2="51.3"/>
    <line x1="52" y1="15" x2="56" y2="15"/><line x1="261" y1="15" x2="265" y2="15"/>
  </g>

  <!-- X tick labels -->
  <g font-size="6.5" fill="#374151" text-anchor="middle" font-family="Arial, sans-serif">
    <text x="78.6" y="171">Control</text>
    <text x="131.9" y="171">TNF-&#x03B1;</text>
    <text x="185.1" y="171">IL-1&#x03B2;</text>
    <text x="238.4" y="171">LPS</text>
  </g>

  <!-- Y tick labels -->
  <g font-size="7" fill="#374151" text-anchor="end" font-family="Arial, sans-serif">
    <text x="49" y="163">0</text>
    <text x="49" y="126.8">2</text>
    <text x="49" y="90.5">4</text>
    <text x="49" y="54.3">6</text>
    <text x="49" y="18">8</text>
  </g>

  <!-- Gene label inside chart -->
  <text x="158.5" y="35" text-anchor="middle" font-size="7.5" fill="#6B7280" font-family="Arial, sans-serif" font-style="italic">IL-6 mRNA</text>

  <!-- Axis titles -->
  <text x="158.5" y="186" text-anchor="middle" font-size="8.5" fill="#111827" font-family="Arial, sans-serif">Treatment condition</text>
  <text x="9" y="87.5" text-anchor="middle" font-size="8" fill="#111827" font-family="Arial, sans-serif" transform="rotate(-90,9,87.5)">Rel. mRNA (fold change)</text>
</svg>
