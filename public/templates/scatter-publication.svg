  <line x1="86"  y1="175" x2="86"  y2="170" stroke="#000" stroke-width="1"/>
  <line x1="131" y1="175" x2="131" y2="170" stroke="#000" stroke-width="1"/>
  <line x1="175" y1="175" x2="175" y2="170" stroke="#000" stroke-width="1"/>
  <line x1="220" y1="175" x2="220" y2="170" stroke="#000" stroke-width="1"/>
  <line x1="264" y1="175" x2="264" y2="170" stroke="#000" stroke-width="1"/>

  <!-- X tick labels -->
