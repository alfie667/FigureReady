  <text x="38" y="146" text-anchor="end" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">2</text>
  <text x="38" y="114" text-anchor="end" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">4</text>
  <text x="38" y="82"  text-anchor="end" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">6</text>
  <text x="38" y="50"  text-anchor="end" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">8</text>
  <text x="38" y="18"  text-anchor="end" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">10</text>

