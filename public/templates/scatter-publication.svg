  <text x="86"  y="186" text-anchor="middle" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">2</text>
  <text x="131" y="186" text-anchor="middle" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">4</text>
  <text x="175" y="186" text-anchor="middle" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">6</text>
  <text x="220" y="186" text-anchor="middle" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">8</text>
  <text x="264" y="186" text-anchor="middle" font-size="10" fill="#000" font-family="Arial, Helvetica, sans-serif">10</text>

  <!-- Y tick marks (inward) -->
  <line x1="42" y1="175" x2="47" y2="175" stroke="#000" stroke-width="1"/>
  <line x1="42" y1="143" x2="47" y2="143" stroke="#000" stroke-width="1"/>
  <line x1="42" y1="111" x2="47" y2="111" stroke="#000" stroke-width="1"/>
  <line x1="42" y1="79"  x2="47" y2="79"  stroke="#000" stroke-width="1"/>
  <line x1="42" y1="47"  x2="47" y2="47"  stroke="#000" stroke-width="1"/>
  <line x1="42" y1="15"  x2="47" y2="15"  stroke="#000" stroke-width="1"/>

  <!-- Y tick labels -->
