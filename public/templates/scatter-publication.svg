<svg viewBox="0 0 280 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="280" height="200" fill="white"/>

  <!-- Y-axis label -->
  <text x="10" y="98" text-anchor="middle" font-size="12" fill="#000" font-family="Arial, Helvetica, sans-serif" transform="rotate(-90,10,98)">Y Variable</text>

  <!-- X-axis label -->
  <text x="152" y="197" text-anchor="middle" font-size="12" fill="#000" font-family="Arial, Helvetica, sans-serif">X Variable</text>

  <!-- Frame (4-sided box) -->
  <rect x="42" y="15" width="222" height="160" fill="none" stroke="#000" stroke-width="1.5"/>

  <!-- X tick marks (inward) -->
