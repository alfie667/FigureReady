  <text x="158.5" y="193" text-anchor="middle" font-size="8.5" fill="#111827" font-family="Arial, sans-serif">CRP (mg/L)</text>
  <text x="9" y="87.5" text-anchor="middle" font-size="8.5" fill="#111827" font-family="Arial, sans-serif" transform="rotate(-90,9,87.5)">IL-6 (pg/mL)</text>
