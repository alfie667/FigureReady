<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200">
  <rect width="280" height="200" fill="white"/>

  <!-- Chart frame -->
  <rect x="52" y="15" width="213" height="145" fill="none" stroke="#111827" stroke-width="1"/>

  <!-- CFP emission curve (cyan, peak ~475 nm) -->
  <polyline points="52,128.6 60.2,93.6 68.4,50.5 76.6,19.5 84.8,19.5 93.0,50.5 101.2,93.6 109.4,128.6 117.6,148.5 125.8,156.7 134.0,159.3 142.2,159.9 160,160" fill="none" stroke="#0891B2" stroke-width="2"/>

  <!-- GFP emission curve (green, peak ~509 nm) -->
  <polyline points="52,156.8 60.2,151.1 68.4,138.8 76.6,117.1 84.8,85.1 93.0,51.4 101.2,24.1 109.4,15.1 117.6,28.4 125.8,58.1 134.0,92.8 142.2,122.2 150.4,141.9 158.6,152.6 166.8,157.4 175.0,159.2 190,160" fill="none" stroke="#16A34A" stroke-width="2"/>

  <!-- mCherry emission curve (red, peak ~610 nm) -->
  <polyline points="117.6,158.4 134.0,150.4 142.2,140.4 150.4,123.8 158.6,100.4 166.8,72.1 175.0,43.9 183.2,22.8 191.4,15 199.6,22.8 207.8,43.9 216.0,72.1 224.2,100.4 232.4,123.8 240.6,140.4 248.8,150.4 257.0,155.9 265,158.4" fill="none" stroke="#DC2626" stroke-width="2"/>

  <!-- X ticks -->
  <g stroke="#374151" stroke-width="0.75">
    <line x1="60.2" y1="160" x2="60.2" y2="156"/><line x1="60.2" y1="15" x2="60.2" y2="19"/>
    <line x1="101.2" y1="160" x2="101.2" y2="156"/><line x1="101.2" y1="15" x2="101.2" y2="19"/>
    <line x1="142.2" y1="160" x2="142.2" y2="156"/><line x1="142.2" y1="15" x2="142.2" y2="19"/>
    <line x1="183.2" y1="160" x2="183.2" y2="156"/><line x1="183.2" y1="15" x2="183.2" y2="19"/>
    <line x1="224.2" y1="160" x2="224.2" y2="156"/><line x1="224.2" y1="15" x2="224.2" y2="19"/>
    <line x1="265" y1="160" x2="265" y2="156"/><line x1="265" y1="15" x2="265" y2="19"/>
  </g>

  <!-- Y ticks -->
  <g stroke="#374151" stroke-width="0.75">
    <line x1="52" y1="160" x2="56" y2="160"/><line x1="261" y1="160" x2="265" y2="160"/>
    <line x1="52" y1="87.5" x2="56" y2="87.5"/><line x1="261" y1="87.5" x2="265" y2="87.5"/>
    <line x1="52" y1="15" x2="56" y2="15"/><line x1="261" y1="15" x2="265" y2="15"/>
  </g>

  <!-- X tick labels -->
  <g font-size="7" fill="#374151" text-anchor="middle" font-family="Arial, sans-serif">
    <text x="60.2" y="170">450</text>
    <text x="101.2" y="170">500</text>
    <text x="142.2" y="170">550</text>
    <text x="183.2" y="170">600</text>
    <text x="224.2" y="170">650</text>
    <text x="265" y="170">700</text>
  </g>

  <!-- Y tick labels -->
  <g font-size="7" fill="#374151" text-anchor="end" font-family="Arial, sans-serif">
    <text x="49" y="163">0</text>
    <text x="49" y="90.5">0.5</text>
    <text x="49" y="18">1.0</text>
  </g>

  <!-- Legend (upper-right — clear of data at λ>640 nm) -->
  <g font-size="7" font-family="Arial, sans-serif" fill="#374151">
    <line x1="222" y1="27" x2="237" y2="27" stroke="#0891B2" stroke-width="2"/>
    <text x="240" y="30">CFP</text>
    <line x1="222" y1="38" x2="237" y2="38" stroke="#16A34A" stroke-width="2"/>
    <text x="240" y="41">GFP</text>
    <line x1="222" y1="49" x2="237" y2="49" stroke="#DC2626" stroke-width="2"/>
    <text x="240" y="52">mCherry</text>
  </g>

  <!-- Axis titles -->
  <text x="158.5" y="193" text-anchor="middle" font-size="8.5" fill="#111827" font-family="Arial, sans-serif">Wavelength (nm)</text>
  <text x="9" y="87.5" text-anchor="middle" font-size="8.5" fill="#111827" font-family="Arial, sans-serif" transform="rotate(-90,9,87.5)">Intensity (a.u.)</text>
</svg>
